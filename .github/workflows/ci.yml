name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Centralized runtime versions for CI jobs.
# Update these defaults when the stack support policy is formalized.
env:
  NODE_VERSION: '20'
  DOTNET_VERSION: '10.0.x'

jobs:
  changes:
    name: Detect project changes
    runs-on: ubuntu-latest
    outputs:
      typescript_changed: ${{ steps.filter.outputs.typescript }}
      dotnet_changed: ${{ steps.filter.outputs.dotnet }}
      typescript_exists: ${{ steps.detect.outputs.typescript_exists }}
      dotnet_exists: ${{ steps.detect.outputs.dotnet_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          changed_files="$(mktemp)"
          base_ref=""

          if [[ -n "${BASE_REF:-}" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            base_ref="FETCH_HEAD"
          elif [[ -n "${BASE_SHA:-}" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            if git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
              base_ref="$BASE_SHA"
            fi
          fi

          if [[ -n "$base_ref" ]]; then
            git diff --name-only "$base_ref" "$HEAD_SHA" > "$changed_files"
          else
            git ls-files > "$changed_files"
          fi

          typescript_pattern='(^|/)(package\.json|tsconfig\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$|\.tsx?$'
          dotnet_pattern='\.(sln|csproj|fsproj|cs)$'

          if grep -E -q "$typescript_pattern" "$changed_files"; then
            echo "typescript=true" >> "$GITHUB_OUTPUT"
          else
            echo "typescript=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -E -q "$dotnet_pattern" "$changed_files"; then
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
          else
            echo "dotnet=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect repository project files (bootstrap-safe)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          tracked_files="$(mktemp)"
          git ls-files > "$tracked_files"

          typescript_pattern='(^|/)(package\.json|tsconfig\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$|\.tsx?$'
          dotnet_pattern='\.(sln|csproj|fsproj|cs)$'

          if grep -E -q "$typescript_pattern" "$tracked_files"; then
            echo "typescript_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "typescript_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -E -q "$dotnet_pattern" "$tracked_files"; then
            echo "dotnet_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "dotnet_exists=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/adr/ADR-001-initial-architecture.md

      - name: Markdown formatting smoke check
        shell: bash
        run: |
          set -euo pipefail
          # Fail on tabs or trailing whitespace in markdown files.
          mapfile -t markdown_files < <(git ls-files '*.md')
          if ((${#markdown_files[@]} == 0)); then
            exit 0
          fi

          if grep -nE $'\t|[ \t]+$' "${markdown_files[@]}"; then
            exit 1
          fi

  typescript:
    name: TypeScript checks
    runs-on: ubuntu-latest
    needs: changes
    # Bootstrap-safe: skip entirely when there are no TS files yet.
    if: needs.changes.outputs.typescript_changed == 'true' || needs.changes.outputs.typescript_exists == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Uses the workflow-level default; change env.NODE_VERSION above to upgrade globally.
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --frozen-lockfile
          elif [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f package.json ]]; then
            npm install
          else
            echo "No Node package manifest in repo root; skipping TS job steps."
            exit 0
          fi

      - name: Lint (if script exists)
        run: npm run lint --if-present

      - name: Typecheck/build (if script exists)
        run: |
          npm run typecheck --if-present
          npm run build --if-present

      - name: Test (if script exists)
        run: npm test --if-present

  dotnet:
    name: .NET checks
    runs-on: ubuntu-latest
    needs: changes
    # Bootstrap-safe: skip entirely when there are no .NET files yet.
    if: needs.changes.outputs.dotnet_changed == 'true' || needs.changes.outputs.dotnet_exists == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Uses the workflow-level default; change env.DOTNET_VERSION above to upgrade globally.
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Ensure GitHub NuGet Source
        shell: pwsh
        env:
          NUGET_TOKEN: ${{ secrets.YARE92_NUGET_TOKEN_EXP_17JUN2026 }}
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/yaron-E92/index.json `
            -n github `
            -u Yaron-E92 `
            -p $env:NUGET_TOKEN `
            --store-password-in-clear-text

      - name: Restore
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore phoodab/backend/*.sln

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          dotnet build --no-restore phoodab/backend/*.sln

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          dotnet test --no-build phoodab/backend/*.sln
