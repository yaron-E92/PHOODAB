name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Centralized runtime versions for CI jobs.
# Update these defaults when the stack support policy is formalized.
env:
  NODE_VERSION: '20'
  DOTNET_VERSION: '10.0.x'

jobs:
  changes:
    name: Detect project changes
    runs-on: ubuntu-latest
    outputs:
      typescript_changed: ${{ steps.filter.outputs.typescript }}
      dotnet_changed: ${{ steps.filter.outputs.dotnet }}
      typescript_exists: ${{ steps.detect.outputs.typescript_exists }}
      dotnet_exists: ${{ steps.detect.outputs.dotnet_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            typescript:
              - '**/package.json'
              - '**/tsconfig.json'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/package-lock.json'
              - '**/pnpm-lock.yaml'
              - '**/yarn.lock'
            dotnet:
              - '**/*.sln'
              - '**/*.csproj'
              - '**/*.fsproj'
              - '**/*.cs'

      - name: Detect repository project files (bootstrap-safe)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | rg -q '(package\.json|tsconfig\.json|\.ts$|\.tsx$|package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$'; then
            echo "typescript_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "typescript_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if git ls-files | rg -q '(\.sln$|\.csproj$|\.fsproj$|\.cs$)'; then
            echo "dotnet_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "dotnet_exists=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/adr/ADR-001-initial-architecture.md

      - name: Markdown formatting smoke check
        run: |
          set -euo pipefail
          # Fail on tabs or trailing whitespace in markdown files.
          ! rg --line-number --pcre2 "\t|[ \t]+$" --glob "*.md" .

  typescript:
    name: TypeScript checks
    runs-on: ubuntu-latest
    needs: changes
    # Bootstrap-safe: skip entirely when there are no TS files yet.
    if: needs.changes.outputs.typescript_changed == 'true' || needs.changes.outputs.typescript_exists == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Uses the workflow-level default; change env.NODE_VERSION above to upgrade globally.
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --frozen-lockfile
          elif [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f package.json ]]; then
            npm install
          else
            echo "No Node package manifest in repo root; skipping TS job steps."
            exit 0
          fi

      - name: Lint (if script exists)
        run: npm run lint --if-present

      - name: Typecheck/build (if script exists)
        run: |
          npm run typecheck --if-present
          npm run build --if-present

      - name: Test (if script exists)
        run: npm test --if-present

  dotnet:
    name: .NET checks
    runs-on: ubuntu-latest
    needs: changes
    # Bootstrap-safe: skip entirely when there are no .NET files yet.
    if: needs.changes.outputs.dotnet_changed == 'true' || needs.changes.outputs.dotnet_exists == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Uses the workflow-level default; change env.DOTNET_VERSION above to upgrade globally.
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Ensure GitHub NuGet Source
        shell: pwsh
        env:
          NUGET_TOKEN: ${{ secrets.YARE92_NUGET_TOKEN_EXP_17JUN2026 }}
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/yaron-E92/index.json `
            -n github `
            -u Yaron-E92 `
            -p $env:NUGET_TOKEN `
            --store-password-in-clear-text

      - name: Restore
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | rg -q '(\.sln$|\.csproj$|\.fsproj$)'; then
            dotnet restore
          else
            echo "No .NET solution/project files found; skipping."
          fi

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | rg -q '(\.sln$|\.csproj$|\.fsproj$)'; then
            dotnet build --no-restore
          else
            echo "No .NET solution/project files found; skipping."
          fi

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | rg -q '(\.sln$|\.csproj$|\.fsproj$)'; then
            dotnet test --no-build
          else
            echo "No .NET solution/project files found; skipping."
          fi
